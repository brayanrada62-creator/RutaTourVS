<div class="login-page">
  <div class="login-right">
    <div class="login-form-wrapper">
      <h2 class="form-title">Iniciar sesión</h2>
      <p class="form-subtitle">Ingresa tus credenciales para continuar</p>

      <form (ngSubmit)="login()" class="login-form">
        <div class="form-group">
          <label class="form-label">Correo electrónico</label>
          <div class="input-row">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="M2 7l10 6 10-6" />
              </svg>
            </span>
            <input
              type="email"
              name="correo"
              [(ngModel)]="usuario.correo"
              placeholder="admin@rutatour.com"
              class="input-field"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <div class="input-row">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="10" width="16" height="11" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
            </span>
            <input
              [type]="mostrarContrasena ? 'text' : 'password'"
              name="contrasena"
              [(ngModel)]="usuario.contrasena"
              placeholder="••••••••••"
              class="input-field"
            />
            <span class="toggle-password" (click)="mostrarContrasena = !mostrarContrasena">
              @if (mostrarContrasena) {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-10-8-10-8a18.4 18.4 0 0 1 4.22-5.36M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19" />
                  <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                  <path d="M1 1l22 22" />
                </svg>
              } @else {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s3-8 11-8 11 8 11 8-3 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </span>
          </div>
        </div>

        <p class="error-message" *ngIf="errorMensaje">{{ errorMensaje }}</p>

        <div class="form-row-between">
          <label class="checkbox-label">
            <input type="checkbox" name="recordarme" [(ngModel)]="recordarme" />
            Recordarme
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="submit-btn">Iniciar sesión</button>
      </form>

      <p class="footer-note">RutaTour Popayán · Acceso exclusivo para personal autorizado</p>
    </div>
  </div>
</div>
