<div class="gestion-viajes">

  <div class="encabezado">
    <div>
      <h1>Gestión de viajes</h1>
      <p class="subtitulo">Administra rutas, horarios y precios.</p>
    </div>
    <button class="btn-nuevo">+ Nuevo viaje</button>
  </div>

  <div class="barra-busqueda">
    <input
      type="text"
      placeholder="Buscar viajes..."
      [(ngModel)]="terminoBusqueda"
    />
    <button class="btn-filtros">Filtros</button>
  </div>

  <table class="tabla-viajes">
    <thead>
      <tr>
        <th>RUTA</th>
        <th>HORARIO</th>
        <th>PRECIO</th>
        <th>ESTADO</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let viaje of viajesFiltrados"
        (click)="seleccionarViaje(viaje)"
        [class.fila-activa]="viaje.id === viajeSeleccionado.id"
      >
        <td>{{ viaje.ruta }}</td>
        <td>{{ viaje.horario }}</td>
        <td>{{ formatearPrecio(viaje.precio) }}</td>
        <td>
          <span class="badge" [ngClass]="viaje.estado === 'Activo' ? 'badge-activo' : 'badge-inactivo'">
            {{ viaje.estado }}
          </span>
        </td>
        <td class="columna-acciones">•••</td>
      </tr>
    </tbody>
  </table>

  <div class="panel-detalle" *ngIf="viajeSeleccionado">

    <p class="breadcrumb">Viajes &gt; {{ viajeSeleccionado.ruta }}</p>

    <div class="pestanas">
      <span
        *ngFor="let pestana of pestanas"
        [class.pestana-activa]="pestana === pestanaActiva"
        (click)="cambiarPestana(pestana)"
      >
        {{ pestana }}
      </span>
    </div>

    <div class="contenido-pestana" *ngIf="pestanaActiva === 'Información'">
      <div class="formulario">
        <label>Nombre del viaje</label>
        <input type="text" [value]="viajeSeleccionado.ruta" readonly />

        <label>Origen</label>
        <input type="text" [value]="viajeSeleccionado.origen" readonly />

        <label>Destino</label>
        <input type="text" [value]="viajeSeleccionado.destino" readonly />
      </div>

      <div class="vista-previa">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="1.5">
          <rect x="3" y="6" width="18" height="10" rx="2"/>
          <circle cx="7.5" cy="18" r="1.5"/>
          <circle cx="16.5" cy="18" r="1.5"/>
          <line x1="3" y1="11" x2="21" y2="11"/>
        </svg>
      </div>
    </div>

    <div class="contenido-pestana" *ngIf="pestanaActiva !== 'Información'">
      <p>Contenido de "{{ pestanaActiva }}" pendiente por construir.</p>
    </div>

  </div>
</div>
