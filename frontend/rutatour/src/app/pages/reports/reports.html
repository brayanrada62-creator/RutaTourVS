<div class="flex h-screen bg-gray-50 text-gray-800">

  <app-sidebar activeLabel="Reportes generales" />

  <main class="flex-1 overflow-y-auto">
    <app-topbar />

    <section class="px-8 pb-10">
      
      <h1 class="text-2xl font-semibold text-gray-900">Reportes generales</h1>
      <p class="text-sm text-gray-500 mt-1">Estadísticas consolidadas de operación, ventas y ocupación.</p>

      <!-- Rango de fecha -->
      <p class="text-[11px] tracking-wide text-gray-400 mt-6 mb-2">RANGO DE FECHA</p>
      <button class="flex items-center gap-2 bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3M4 11h16M5 21h14a1 1 0 001-1V7a1 1 0 00-1-1H5a1 1 0 00-1 1v13a1 1 0 001 1z" />
        </svg>
        {{ dateRange }}
      </button>

      <!-- Tarjetas de reportes -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-6">
        <button *ngFor="let report of reportCards"
                class="flex items-center gap-4 bg-white rounded-2xl border border-gray-100 p-5 text-left hover:border-emerald-200 transition-colors">
          <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0">
            <svg *ngIf="report.icon === 'chart'" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m6 10V5m6 14v-6" />
            </svg>
            <svg *ngIf="report.icon === 'bus'" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 13l1.5-4.5A2 2 0 016.4 7h11.2a2 2 0 011.9 1.5L21 13m-18 0v5a1 1 0 001 1h1a1 1 0 001-1v-1h12v1a1 1 0 001 1h1a1 1 0 001-1v-5m-18 0h18" />
            </svg>
            <svg *ngIf="report.icon === 'map'" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-6-3V4l6 3m0 13l6-3m-6 3V7m6 10l6 3V7l-6-3m0 13V4m0 3L9 4" />
            </svg>
            <svg *ngIf="report.icon === 'file'" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h7l5 5v11a2 2 0 01-2 2z" />
            </svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-gray-900">{{ report.title }}</p>
            <p class="text-xs text-gray-400 mt-0.5">{{ report.subtitle }}</p>
          </div>
        </button>
      </div>
    </section>
  </main>
</div>
